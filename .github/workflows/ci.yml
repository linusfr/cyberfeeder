name: ci

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provides node, prek and jq, pinned in bin/ - no separate setup-node or
      # tool installs to keep in sync with what contributors run locally.
      - name: Activate Hermit
        uses: cashapp/activate-hermit@v1

      - name: Install dependencies
        run: npm ci

      - name: Run prek hooks
        run: prek run --all-files --show-diff-on-failure

      # prek only runs the pre-commit stage above, and the build is what catches
      # a change that compiles for one engine but not the other.
      - name: Build firefox target
        run: npm run build

      # Packaged only on pull requests, where an installable build lets a
      # reviewer load the extension without a local toolchain. On main the
      # release job attaches the same zips to the release. Each target is
      # zipped straight after its build, as app/ holds one at a time.
      - name: Package firefox target
        if: github.event_name == 'pull_request'
        run: npm run package

      - name: Build chromium target
        run: npm run build:chromium

      - name: Package chromium target
        if: github.event_name == 'pull_request'
        run: npm run package:chromium

      - name: Upload extension zips
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cyberfeeder-zips
          path: build/*.zip
          if-no-files-found: error
          retention-days: 14

  # Same workflow rather than its own file, so a release can never be cut from a
  # commit whose lint or build failed.
  release:
    needs: checks
    # Manual dispatch is reserved for read-only diagnostics below. Releases are
    # created only by pushes to main.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # contents only: the github plugin's issue/PR comments and labels are
    # turned off in .releaserc.json, so nothing outside the repo tree is written.
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # semantic-release needs full history and tags
          persist-credentials: false

      - name: Activate Hermit
        uses: cashapp/activate-hermit@v1

      - name: Install dependencies
        run: npm ci

      # Bumps package.json and both manifests, writes CHANGELOG.md, tags
      # v<version>, and attaches both extension zips to the GitHub release.
      #
      # Fetched by npx at exact versions rather than added to devDependencies:
      # semantic-release is only ever run here, and as a dependency it pulls
      # ~400 transitive packages into package-lock.json that no build, hook or
      # contributor needs. Version bumps are a one-line edit below.
      - name: Release
        run: |
          npx --yes \
            -p semantic-release@25.0.9 \
            -p @semantic-release/changelog@7.0.0 \
            -p @semantic-release/exec@7.1.0 \
            -p @semantic-release/git@11.0.1 \
            -p conventional-changelog-conventionalcommits@8.0.0 \
            semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Verify OIDC, service-account access, and store identifiers without uploading
  # or submitting a package. Run manually from the Actions tab on main.
  chrome-store-smoke:
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - id: google_auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Fetch Chrome Web Store status
        env:
          ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          PUBLISHER_ID: ${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}
          EXTENSION_ID: ${{ vars.CHROME_WEB_STORE_EXTENSION_ID }}
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $ACCESS_TOKEN" \
            "https://chromewebstore.googleapis.com/v2/publishers/$PUBLISHER_ID/items/$EXTENSION_ID:fetchStatus")"
          jq -e --arg item "$EXTENSION_ID" '.itemId == $item' <<<"$response" >/dev/null
          jq '{itemId, takenDown, warned, publishedState: .publishedItemRevisionStatus.state, submittedState: .submittedItemRevisionStatus.state}' <<<"$response"
